<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إضافة إعلان | سوق السودان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="logo">س</div>
          <div>
            <div class="brand-name">سوق السودان</div>
            <div class="brand-tag">بيع وشراء آمن</div>
          </div>
        </div>
        <div class="nav-actions">
          <a class="btn btn-light" href="index.html">الرئيسية</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <section class="listing-box">
        <div class="form-header">
          <h2>إضافة إعلان جديد</h2>
          <p>أضف منتجك، السعر، وبيانات التواصل بطريقة آمنة</p>
        </div>

        <form id="listing-form">
          <div class="inline-row">
            <div class="form-group">
              <label for="title">عنوان الإعلان</label>
              <input id="title" type="text" placeholder="مثال: هاتف آيفون 13 برو" required />
            </div>

            <div class="form-group">
              <label for="category">الفئة</label>
              <select id="category">
                <option>هاتف</option>
                <option>سيارة</option>
                <option>أثاث</option>
                <option>ملابس</option>
                <option>أجهزة</option>
                <option>أخرى</option>
              </select>
            </div>
          </div>

          <div class="inline-row">
            <div class="form-group">
              <label for="price">السعر (جنيه سوداني)</label>
              <input id="price" type="number" placeholder="15000" required />
            </div>

            <div class="form-group">
              <label for="whatsapp">واتساب / رقم الهاتف</label>
              <input id="whatsapp" type="tel" placeholder="0927154913" required />
            </div>
          </div>

          <div class="form-group">
            <label for="details">وصف المنتج</label>
            <textarea id="details" placeholder="اكتب وصف المنتج، الحالة، العيوب إن وجدت..."></textarea>
          </div>

          <div class="form-group">
            <label for="image">رابط الصورة</label>
            <input id="image" type="url" placeholder="https://..." />
          </div>

          <button class="btn btn-primary primary-btn-wide" type="submit">نشر الإعلان</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
