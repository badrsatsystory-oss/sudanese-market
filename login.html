<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | سوق السودان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="logo">س</div>
          <div>
            <div class="brand-name">سوق السودان</div>
            <div class="brand-tag">بيع وشراء آمن</div>
          </div>
        </div>
        <div class="nav-actions">
          <a class="btn btn-light" href="index.html">الرئيسية</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <section class="auth-box">
        <div class="form-header">
          <h2>تسجيل الدخول</h2>
          <p>منصة سوق سوداني موثوقة وآمنة</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input id="email" type="email" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input id="password" type="password" placeholder="••••••••" required />
          </div>

          <button class="btn btn-primary primary-btn-wide" type="submit">دخول</button>

          <div class="helper-link">
            ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
          </div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
